<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Let's Connect — a message travels from the jungle to the city</title>
  <desc id="desc">A bright, friendly animated landscape with a tropical jungle on one side and a glowing city on the other, joined by a pulsing connection cable carrying a message.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1a38"/>
      <stop offset="1" stop-color="#193d64"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#155c58"/>
      <stop offset="1" stop-color="#0b293e"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55e6bd"/>
      <stop offset=".5" stop-color="#8cecff"/>
      <stop offset="1" stop-color="#ffc978"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263d68"/>
      <stop offset="1" stop-color="#111d3a"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#fff1bd" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff1bd" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#sky)"/>
  <circle cx="1010" cy="56" r="60" fill="url(#moonGlow)"/>
  <circle cx="1010" cy="56" r="21" fill="#ffe8a6" opacity=".92"/>
  <g fill="#d5f3ff" opacity=".72">
    <circle cx="170" cy="39" r="1.5"/><circle cx="410" cy="28" r="1.2"/><circle cx="730" cy="42" r="1.4"/><circle cx="865" cy="25" r="1"/><circle cx="1110" cy="101" r="1.5"/>
    <circle cx="550" cy="60" r="1.1"><animate attributeName="opacity" values=".25;1;.25" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="82" r="1.4"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <text x="600" y="42" text-anchor="middle" fill="#e9f8ff" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="3">LET’S CONNECT</text>
  <text x="600" y="63" text-anchor="middle" fill="#a9c7e4" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="1">GOOD IDEAS TRAVEL FAR</text>

  <!-- distant hills and landscape -->
  <path d="M0 173 Q145 101 300 164T610 156T900 166T1200 135V280H0Z" fill="#1c5960" opacity=".7"/>
  <path d="M0 199 Q190 147 355 190T690 177T1000 185T1200 165V280H0Z" fill="url(#ground)"/>

  <!-- city skyline -->
  <g fill="url(#city)" stroke="#5274a0" stroke-width="1">
    <path d="M735 280V154h67v126z"/><path d="M795 280V128h58v152z"/><path d="M846 280V174h75v106z"/>
    <path d="M913 280V117h71v163z"/><path d="M978 280V151h55v129z"/><path d="M1027 280V133h76v147z"/><path d="M1096 280V170h65v110z"/>
    <path d="M811 128l13-20 13 20z"/><path d="M931 117l17-26 17 26z"/><path d="M1048 133l17-25 17 25z"/>
  </g>
  <g fill="#ffd77b">
    <path d="M808 145h7v10h-7zm18 0h7v10h-7zm-18 25h7v10h-7zm18 0h7v10h-7zm-18 25h7v10h-7zm18 0h7v10h-7z"/>
    <path d="M926 137h8v11h-8zm20 0h8v11h-8zm-20 24h8v11h-8zm20 0h8v11h-8zm-20 24h8v11h-8zm20 0h8v11h-8zm-20 24h8v11h-8zm20 0h8v11h-8z"/>
    <path d="M1042 151h7v10h-7zm18 0h7v10h-7zm18 0h7v10h-7zm-36 24h7v10h-7zm18 0h7v10h-7zm18 0h7v10h-7zm-36 24h7v10h-7zm18 0h7v10h-7z"/>
    <path d="M750 170h7v10h-7zm18 0h7v10h-7zm0 24h7v10h-7z"/>
    <animate attributeName="opacity" values=".8;1;.8" dur="3.5s" repeatCount="indefinite"/>
  </g>

  <!-- jungle silhouettes -->
  <g fill="#103d48">
    <path d="M0 280V179q0-24 18-34 18 10 18 34v101z"/><path d="M26 280V154q0-28 20-40 20 12 20 40v126z"/>
    <path d="M75 280V190q0-20 16-31 16 11 16 31v90z"/><path d="M112 280V161q0-28 20-41 20 13 20 41v119z"/>
    <path d="M154 280V192q0-22 17-34 17 12 17 34v88z"/><path d="M190 280V166q0-30 21-45 21 15 21 45v114z"/>
    <path d="M228 280V198q0-23 18-36 18 13 18 36v82z"/><path d="M266 280V170q0-29 20-43 20 14 20 43v110z"/>
  </g>
  <g fill="#287b69">
    <path d="M23 154q-43-4-48-36 34-7 54 18-16-37 5-57 24 29 5 61 24-34 53-23-8 39-48 43z"/>
    <path d="M131 164q-40-8-42-40 35-4 51 24-11-40 14-57 20 32-3 61 28-28 55-12-14 37-54 34z"/>
    <path d="M210 169q-38-10-37-41 35-2 49 27-9-40 17-55 18 33-7 60 30-25 56-8-16 36-55 29z"/>
    <path d="M290 178q-36-12-31-42 34 1 44 31-4-40 24-51 14 35-14 59 32-21 56 0-20 33-58 21z"/>
  </g>
  <g fill="#56b887" opacity=".8">
    <ellipse cx="33" cy="211" rx="40" ry="13"/><ellipse cx="139" cy="220" rx="43" ry="12"/><ellipse cx="242" cy="219" rx="40" ry="13"/><ellipse cx="326" cy="225" rx="38" ry="12"/>
  </g>
  <!-- gently swaying jungle leaves -->
  <g transform-origin="48px 145px">
    <animateTransform attributeName="transform" type="rotate" values="-2 48 145;2 48 145;-2 48 145" dur="4s" repeatCount="indefinite"/>
    <path d="M42 163Q4 133 5 98q36 17 45 52Q38 112 58 79q25 36-5 72" fill="#4bc18a"/>
  </g>
  <g transform-origin="210px 157px">
    <animateTransform attributeName="transform" type="rotate" values="1 210 157;-2 210 157;1 210 157" dur="5s" repeatCount="indefinite"/>
    <path d="M205 176q-35-32-24-65 33 20 30 55 5-39 37-48 9 40-28 61" fill="#64d19b"/>
  </g>

  <!-- communication cable and traveling message -->
  <path d="M294 105 Q510 172 735 116" fill="none" stroke="#0b1c34" stroke-width="8" stroke-linecap="round" opacity=".7"/>
  <path d="M294 105 Q510 172 735 116" fill="none" stroke="url(#wire)" stroke-width="3" stroke-linecap="round"/>
  <path d="M294 105 Q510 172 735 116" fill="none" stroke="#e7ffff" stroke-width="1" stroke-dasharray="5 13" stroke-linecap="round" opacity=".75">
    <animate attributeName="stroke-dashoffset" from="0" to="72" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <g filter="url(#softGlow)">
    <circle r="6" fill="#f4ffff"><animateMotion dur="5s" repeatCount="indefinite" path="M294 105 Q510 172 735 116"/></circle>
    <circle r="3" fill="#ffdf93"><animateMotion dur="5s" begin="2.5s" repeatCount="indefinite" path="M294 105 Q510 172 735 116"/></circle>
  </g>
  <!-- small message traveling along the cable -->
  <g>
    <animateMotion dur="7s" repeatCount="indefinite" path="M294 105 Q510 172 735 116"/>
    <rect x="-9" y="-7" width="18" height="13" rx="2.5" fill="#fff4d8" stroke="#f1b85f" stroke-width="1"/>
    <path d="M-7-5l7 6 7-6" fill="none" stroke="#4e7099" stroke-width="1.3"/>
  </g>
  <!-- connection lights -->
  <circle cx="294" cy="105" r="5" fill="#8cf3cf"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="735" cy="116" r="5" fill="#ffe09a"><animate attributeName="r" values="4;7;4" dur="2s" begin=".7s" repeatCount="indefinite"/></circle>

  <!-- little fireflies -->
  <g fill="#d7ff8b">
    <circle cx="372" cy="213" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="2s" repeatCount="indefinite"/><animate attributeName="cy" values="213;202;213" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="232" r="1.7"><animate attributeName="opacity" values="1;.15;1" dur="2.7s" repeatCount="indefinite"/><animate attributeName="cy" values="232;219;232" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="678" cy="216" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="2.4s" repeatCount="indefinite"/><animate attributeName="cy" values="216;205;216" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
