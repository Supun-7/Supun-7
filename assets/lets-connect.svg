<svg xmlns="http://www.w3.org/2000/svg" width="320" height="140" viewBox="0 0 320 140" role="img" aria-labelledby="title desc">
  <title id="title">Animated letter delivered to a mailbox</title>
  <desc id="desc">A little envelope flies along a dotted path and drops into a cheerful mailbox. The mailbox flag lifts to show a new message has arrived.</desc>
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8d8d"/>
      <stop offset="1" stop-color="#ed5d79"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#c9f1ff"/>
    </linearGradient>
  </defs>

  <!-- Small floating dots give the delivery path a playful feel. -->
  <g fill="#76c9f8">
    <circle cx="28" cy="74" r="2"><animate attributeName="opacity" values=".25;1;.25" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="53" cy="63" r="1.7"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="78" cy="70" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M22 91 Q88 34 158 76" fill="none" stroke="#9bdcf5" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round" opacity=".8"/>

  <!-- Mailbox post and base -->
  <path d="M237 85h10v45h-10z" fill="#6583a5"/>
  <path d="M221 129h42" stroke="#526d8b" stroke-width="5" stroke-linecap="round"/>

  <!-- Mailbox roof and body -->
  <path d="M190 61v-7q0-24 24-24h52q24 0 24 24v7z" fill="url(#box)"/>
  <rect x="190" y="55" width="100" height="47" rx="8" fill="url(#box)"/>
  <path d="M197 61h86v32h-86z" fill="#ffb1ad" opacity=".28"/>
  <path d="M199 73h82" stroke="#9b3e62" stroke-width="5" stroke-linecap="round"/>
  <path d="M204 83h72" stroke="#ffd6cf" stroke-width="2" stroke-linecap="round" opacity=".8"/>

  <!-- Mailbox flag, lifting after delivery -->
  <path d="M281 62v-30" stroke="#6c536f" stroke-width="3" stroke-linecap="round"/>
  <path d="M281 33h20v13h-20z" rx="2" fill="#ffd166" transform-origin="281px 46px">
    <animateTransform attributeName="transform" type="rotate" values="0 281 46;0 281 46;-34 281 46;-34 281 46;0 281 46" keyTimes="0;.55;.68;.9;1" dur="4.2s" repeatCount="indefinite"/>
  </path>
  <circle cx="281" cy="62" r="3" fill="#fff2bd"/>

  <!-- Little envelope flies in, slips through the slot, then reappears for another delivery. -->
  <g>
    <animateMotion dur="4.2s" repeatCount="indefinite" keyPoints="0;0.76;0.9;1" keyTimes="0;.62;.72;1" calcMode="linear" path="M24 84 Q89 34 157 76 Q183 91 206 76"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.58;.66;.94;1" dur="4.2s" repeatCount="indefinite"/>
    <rect x="-11" y="-8" width="22" height="16" rx="3" fill="url(#letter)" stroke="#5d9bb8" stroke-width="1.4"/>
    <path d="M-9-6l9 7 9-7" fill="none" stroke="#5d9bb8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Friendly arrival sparkle -->
  <g fill="#ffd166">
    <path d="M176 47l3 7 7 3-7 3-3 7-3-7-7-3 7-3z">
      <animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values=".75 176 57;1.1 176 57;.75 176 57" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <circle cx="302" cy="80" r="2"><animate attributeName="opacity" values=".15;1;.15" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <text x="242" y="118" text-anchor="middle" fill="#66809d" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="1.2">YOU’VE GOT MAIL</text>
</svg>
